<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.cdnfonts.com/css/inter" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/augify-demo" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/montserrat" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js">
    <link rel="stylesheet" type="text/css"
        href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.bundle.min.js">
    <link rel="stylesheet" href="css/style.css">
    <!-- <link href="https://unpkg.com/tailwindcss@^1.0/dist/tailwind.min.css" rel="stylesheet"> -->
    <title>First Timers</title>
</head>
<body class="">
    <div class="strip"></div>
    <header>
        <img src="images/CWC-logo.png" class="img-fluid" alt="logo">
        <p>Have You Found a</p>
        <span class="home">HOME?</span>
    </header>
    <section>
        <img src="images/Mask group.png" class="img-fluid" alt="">
    </section>
    <form action="">
        <div class="title">
            <h1>First Timers' Form</h1>
            <img src="images/underline.png" alt="">
        </div>

        <div class="form-group">
            <label for="fname">First Name</label>
            <input type="text" class="form-control" id="fname"  name="fname">
        </div>
        <div class="form-group">
            <label for="lname">Last Name <span class="light">(Surname)</span></label>
            <input type="text" class="form-control" id="lname"  name="lname">
        </div>
        <div class="form-group">
            <label for="callphone">Phone Number <span class="light">(Calls)</span></label>
            <input type="tel" class="form-control" id="callphone"  name="callphone">
        </div>
        <div class="form-group">
            <label for="waphone">Phone Number <span class="light">(Whatsapp)</span></label>
            <input type="tel" class="form-control" id="waphone"  name="waphone">
        </div>
        <div class="form-group">
            <label for="lname">Residential Address</label>
            <input type="text" class="form-control" id="lname" name="lname">
        </div>
    </form>
</body>
</html>
